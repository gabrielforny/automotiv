name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Build com PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name AutomotivBot `
            --add-data "config;config" `
            --add-data "assets;assets" `
            --add-data "data;data" `
            gui_launcher.py

      - name: Zipar pasta gerada
        run: Compress-Archive -Path dist\AutomotivBot -DestinationPath AutomotivBot.zip

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: AutomotivBot-${{ github.run_number }}
          path: AutomotivBot.zip
          retention-days: 30
