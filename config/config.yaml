app:
  shortcut_name: "MenuGRV3 - Atalho (3).lnk"
  window_title_regex: ".*(CPS|GRV|AUTOMOTIV).*"
  login_password: "123456"
  wait_after_login_seconds: 15
  wait_after_open_screen_seconds: 5

excel:
  default_path: "C:/Users/User/Documents/automotiv/SOLICITAÇÃO DE ORÇAMENTO (1).xlsx"
  header_row: 7
  first_data_row: 8
  columns:
    code_or_reference: "CÓDIGO / REFERÊNCIA / PARTE NUMBER"
    quantity: "QUANTIDADE"
    item: "ITEM"

search:
  fallback_site: "https://www.automotivdobrasil.com.br"
  active_first: true
  try_inactive_when_not_found: true
  min_grid_rows_to_consider_found: 1

runtime:
  dry_run: false
  use_image_fallback: true
  pause_between_actions_seconds: 0.5
  log_level: "INFO"

paths:
  data_dir: "data"
  pending_dir: "data/a_processar"
  processed_dir: "data/processados"
  history_dir: "data/historico"
  export_dir: "data/exportados"
  pdf_dir: "data/pdfs"

export:
  download_dir: "C:/Users/User/Documents/automotiv/data/exportados"
  exported_file_prefix: "automotiv_material"
  wait_timeout_seconds: 90

workflow:
  # Deixe false enquanto ainda estiver validando só materiais/cliente.
  # Quando as imagens do fluxo de orçamento estiverem prontas, mude para true.
  enable_budget_flow: true
  default_margin: ""
  observation_placeholder: "-"
  previous_orders_months_back: 12
  save_retry_attempts: 2
  generate_pdf: true

site_search:
  wait_after_open_seconds: 3
  wait_after_search_seconds: 2

images:
  assets_dir: "assets/images"
  confidence: 0.85

  input_senha: "input_senha.png"
  input_nome_login: "input_nome_login.png"
  login_button: "login_button.png"

  menu_cadastro: "menu_cadastro.png"
